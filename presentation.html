 <link rel="stylesheet" href="presentation.css">

  <section class="presentation-section">
    <div class="presentation-container">
      <h2 class="presentation-title">Презентація</h2>
      <p class="presentation-subtitle">Зверніться до нашого консультанта.</p>

      <form class="presentation-form">
        <div class="form-row">
          <div class="form-group">
            <label>Ім’я*</label>
            <input type="text" required>
          </div>
          <div class="form-group">
            <label>Прізвище*</label>
            <input type="text" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Ел. пошта*</label>
            <input type="email" required>
          </div>
          <div class="form-group">
            <label>Телефон</label>
            <input type="tel">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Компанія</label>
            <input type="text">
          </div>
          <div class="form-group">
            <label>Посада</label>
            <input type="text">
          </div>
        </div>

        <button type="submit" class="submit-btn">Надіслати</button>
        <p class="form-message">Дякуємо, що надіслали.</p>
      </form>
    </div>
  </section>
